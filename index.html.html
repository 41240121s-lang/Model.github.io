<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 行動裝置 Web App 全螢幕與標籤優化 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#070a12">
    <title>3x3x3 積木三視圖行動學習模擬器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #070a12;
            color: #f1f5f9;
        }

        html, body {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 999px;
        }

        .glow-active {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .glow-destroy {
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }

        .grid-cell {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .grid-cell:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="flex flex-col h-full w-full">

    <!-- Header Navigation -->
    <header class="h-14 bg-slate-900/95 border-b border-slate-800 shrink-0 px-3 flex items-center justify-between z-30 backdrop-blur-md">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-400 flex items-center justify-center text-white shadow-md font-bold text-lg">
                <i class="fa-solid fa-cubes-stacked"></i>
            </div>
            <div>
                <h1 class="text-sm sm:text-base font-bold bg-gradient-to-r from-blue-400 via-indigo-300 to-emerald-400 bg-clip-text text-transparent leading-tight">
                    3x3x3 積木三視圖
                </h1>
                <p class="text-[10px] text-slate-400 leading-none">行動學習 · 觀測繪製三視圖測驗</p>
            </div>
        </div>

        <!-- Mode Switches & Actions -->
        <div class="flex items-center gap-2">
            <!-- Mode Toggle Switch (Free Build vs Quiz) -->
            <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button id="btn-app-free" onclick="setAppMode('free')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow">
                    自由建造
                </button>
                <button id="btn-app-quiz" onclick="setAppMode('quiz')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white">
                    測驗關卡
                </button>
            </div>

            <!-- Quiz Drawer Trigger -->
            <button id="btn-quiz-list" onclick="openQuizModal()" class="hidden h-9 px-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-bold flex items-center gap-1 active:scale-95 transition-all">
                <i class="fa-solid fa-list-check text-amber-400"></i>

            <!-- Sound Toggle -->

    <!-- Main Content Area -->

                            <!-- Rendered JS -->
                        </div>
                        <div class="text-[10px] text-slate-400 flex flex-col gap-1 justify-center">
                            <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-emerald-500 inline-block"></span> 點擊該位置</div>

                    </div>

                            <div id="grid-top" class="grid grid-cols-3 gap-1 w-full aspect-square bg-slate-900 p-1 rounded-xl border border-slate-800">

                            </div>

                        <!-- Front View (前視圖) -->

                            <div class="text-[10px] font-bold text-blue-400 mb-1 flex items-center gap-1">
                                <span class="w-2 h-2 rounded-full bg-blue-500"></span> 前視圖
                            </div>
                            <div id="grid-front" class="grid grid-cols-3 gap-1 w-full aspect-square bg-slate-900 p-1 rounded-xl border border-slate-800">
                                <!-- Rendered JS -->
                            </div>
                        </div>

                        <!-- Right View (右視圖) -->

                            <div class="text-[10px] font-bold text-emerald-400 mb-1 flex items-center gap-1">
                                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> 右視圖
                            </div>
                            <div id="grid-right" class="grid grid-cols-3 gap-1 w-full aspect-square bg-slate-900 p-1 rounded-xl border border-slate-800">
                                <!-- Rendered JS -->
                            </div>
                        </div>

                <!-- QUIZ: INTERACTIVE 3-VIEW DRAWING CANVAS (Active during Quizzes) -->
                <div id="quiz-drawing-section" class="hidden flex-col gap-2.5 bg-indigo-950/30 border border-indigo-500/40 p-3 rounded-2xl">
                    <div class="flex items-center justify-between border-b border-indigo-900/60 pb-1.5">

                            <i class="fa-solid fa-pen-ruler"></i>

                            <div id="draw-grid-top" class="grid grid-cols-3 gap-1 w-full aspect-square bg-slate-900 p-1 rounded-xl border border-slate-800">

                            </div>

                        <!-- User Drawing Front View -->

                            <div class="text-[10px] font-bold text-blue-400 mb-1">前視圖 (繪製)</div>
                            <div id="draw-grid-front" class="grid grid-cols-3 gap-1 w-full aspect-square bg-slate-900 p-1 rounded-xl border border-slate-800">

                            </div>

                        <!-- User Drawing Right View -->
                        <div class="bg-slate-950 p-2 rounded-2xl border border-emerald-900/50 flex flex-col items-center">
                            <div class="text-[10px] font-bold text-emerald-400 mb-1">右視圖 (繪製)</div>
                            <div id="draw-grid-right" class="grid grid-cols-3 gap-1 w-full aspect-square bg-slate-900 p-1 rounded-xl border border-slate-800">

    <!-- Quiz Selection Modal -->
    <div id="quiz-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            
            <div class="p-4 border-b border-slate-800 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-graduation-cap text-indigo-400 text-lg"></i>
                    <div>
                        <h3 class="font-bold text-sm text-slate-100">三視圖 10 大觀測繪圖關卡</h3>
                        <p class="text-[10px] text-slate-400">請選擇題型關卡進行練習與挑戰</p>
                    </div>
                </div>

                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Quiz List Content -->
            <div id="quiz-list-container" class="p-3 overflow-y-auto custom-scroll flex flex-col gap-2">
                <!-- Rendered by JS -->
            </div>

            <div class="p-3 border-t border-slate-800 shrink-0">
                <button onclick="closeQuizModal()" class="w-full py-2 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs hover:bg-slate-700 transition-colors">
                    關閉選單
                </button>
            </div>
        </div>

    <script>
        // --- 1. Global Application State ---
        const GRID_SIZE = 3;
        
        // 3D Grid State [x][y][z]
        let gridState = Array(GRID_SIZE).fill(null).map(() => 
            Array(GRID_SIZE).fill(null).map(() => 
                Array(GRID_SIZE).fill(false)
            )
        );

        // State for Quizzes (User drawn 2D projections)
        let userDrawnState = {
            top: Array(3).fill(null).map(() => Array(3).fill(false)),
            front: Array(3).fill(null).map(() => Array(3).fill(false)),
            right: Array(3).fill(null).map(() => Array(3).fill(false))
        };

        let appMode = 'free'; // 'free' or 'quiz'
        let currentBuildMode = 'build'; // 'build' or 'destroy'
        let isMultiviewVisible = true;
        let currentQuizIndex = 0;
        let soundEnabled = true;

        // --- Web Audio Sound FX Synth ---
        let audioCtx = null;
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'build') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(640, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'destroy') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.09);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
                    osc.start(now);
                    osc.stop(now + 0.09);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(180, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                }
            } catch (e) {
                console.warn(e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            const btn = document.getElementById('btn-sound');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-sm';
                btn.className = 'w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-indigo-400 active:scale-95 transition-all';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-sm';
                btn.className = 'w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-500 active:scale-95 transition-all';
            }
        }

        // --- 2. 10 Interactive Quizzes (All Draw 3-Views from 3D Model) ---
        const QUIZZES = [
            {
                id: 1,
                type: 'draw',
                title: '測驗 1：L 型立體牆',
                desc: '觀察 3D 視角中的 L 型牆面模型，請在下方點擊塗黑對應的俯、前、右視圖。',
                modelGridState: (() => {
                    const g = Array(3).fill(null).map(() => Array(3).fill(null).map(() => Array(3).fill(false)));

        // --- 3. Three.js 3D Setup & Intuitive Drag Physics ---
        let scene, camera, renderer;
        let blocksGroup, baseGridGroup, indicatorGroup;
        let raycaster, mouse;

        // Camera Spherical Angles
        let cameraAngleTheta = Math.PI / 4; 
        let cameraAnglePhi = Math.PI / 3.2;   
        let cameraRadius = 8.2;
        const cameraTarget = new THREE.Vector3(0, 0.4, 0);

        // Touch gesture tracking
        let isPointerDown = false;
        let startTouchPos = { x: 0, y: 0 };
        let prevTouchPos = { x: 0, y: 0 };
        let initialPinchDistance = null;

        function init3D() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x070a12);

            camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 1000);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
            dirLight.position.set(8, 16, 12);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0x818cf8, 0.35);
            fillLight.position.set(-8, -6, -8);
            scene.add(fillLight);

            blocksGroup = new THREE.Group();
            baseGridGroup = new THREE.Group();
            indicatorGroup = new THREE.Group();
            scene.add(blocksGroup);
            scene.add(baseGridGroup);
            scene.add(indicatorGroup);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            createBaseGrid();
            createFrontIndicator();

            // Event Binding with Intuitive Drag Direction
            const dom = renderer.domElement;
            dom.addEventListener('pointerdown', onPointerDown);
            dom.addEventListener('pointermove', onPointerMove);
            dom.addEventListener('pointerup', onPointerUp);
            dom.addEventListener('wheel', onWheel, { passive: true });

            dom.addEventListener('touchstart', onTouchStart, { passive: false });
            dom.addEventListener('touchmove', onTouchMove, { passive: false });
            dom.addEventListener('touchend', onTouchEnd);

            window.addEventListener('resize', onWindowResize);

            updateBlocks3D();
            updateAllProjections();
            animate();
        }

        function createCubeMaterials() {
            // Right (+X) = Emerald Green
            // Left (-X)  = Slate Gray
            // Top (+Y)   = Rose Red
            // Bottom (-Y)= Dark Slate
            // Front (+Z) = Royal Blue
            // Back (-Z)  = Slate Gray
            return [
                new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.35, metalness: 0.1 }),
                new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 }),
                new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.35, metalness: 0.1 }),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 }),
                new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.35, metalness: 0.1 }),
                new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 })
            ];
        }

        function createBaseGrid() {
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    const sceneX = x - 1;
                    const sceneZ = y - 1;

                    const geometry = new THREE.BoxGeometry(0.96, 0.08, 0.96);
                    const material = new THREE.MeshStandardMaterial({
                        color: 0x1e293b,
                        roughness: 0.7,
                        metalness: 0.1
                    });
                    const tile = new THREE.Mesh(geometry, material);
                    tile.position.set(sceneX, -0.04, sceneZ);
                    tile.userData = { gridX: x, gridY: y, isBaseTile: true };
                    tile.receiveShadow = true;
                    baseGridGroup.add(tile);

                    const edges = new THREE.EdgesGeometry(geometry);
                    const lineMat = new THREE.LineBasicMaterial({ color: 0x475569 });
                    const line = new THREE.LineSegments(edges, lineMat);
                    line.position.copy(tile.position);
                    baseGridGroup.add(line);
                }
            }

            const frameGeo = new THREE.BoxGeometry(3.3, 0.12, 3.3);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(0, -0.12, 0);
            baseGridGroup.add(frame);
        }

        function createFrontIndicator() {
            const arrowGroup = new THREE.Group();

            const arrowGeo = new THREE.ConeGeometry(0.2, 0.4, 4);
            const arrowMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6 });
            const arrow = new THREE.Mesh(arrowGeo, arrowMat);
            arrow.rotation.x = Math.PI / 2;
            arrow.rotation.z = Math.PI / 4;
            arrow.position.set(0, -0.04, 2.05);
            arrowGroup.add(arrow);

            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#1e3a8a';
            ctx.beginPath();
            ctx.roundRect(10, 20, 236, 88, 20);
            ctx.fill();
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 44px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('▲ 前方', 128, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const labelGeo = new THREE.PlaneGeometry(1.4, 0.7);
            const labelMat = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide
            });
            const labelMesh = new THREE.Mesh(labelGeo, labelMat);
            labelMesh.position.set(0, -0.04, 2.7);
            labelMesh.rotation.x = -Math.PI / 3.4;
            arrowGroup.add(labelMesh);

            indicatorGroup.add(arrowGroup);
        }

        function updateBlocks3D() {
            while (blocksGroup.children.length > 0) {
                const child = blocksGroup.children[0];
                if (child.geometry) child.geometry.dispose();
                blocksGroup.remove(child);
            }

            const materials = createCubeMaterials();
            let count = 0;

            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let z = 0; z < GRID_SIZE; z++) {
                        if (gridState[x][y][z]) {
                            count++;
                            const sceneX = x - 1;
                            const sceneY = z + 0.5;
                            const sceneZ = y - 1;

                            const geometry = new THREE.BoxGeometry(0.94, 0.94, 0.94);
                            const cube = new THREE.Mesh(geometry, materials);
                            cube.position.set(sceneX, sceneY, sceneZ);
                            cube.castShadow = true;
                            cube.receiveShadow = true;
                            cube.userData = { gridX: x, gridY: y, gridZ: z, isBlock: true };

                            const edges = new THREE.EdgesGeometry(geometry);
                            const lineMat = new THREE.LineBasicMaterial({ color: 0x070a12, linewidth: 2 });
                            const line = new THREE.LineSegments(edges, lineMat);
                            cube.add(line);

                            blocksGroup.add(cube);
                        }
                    }
                }
            }

            document.getElementById('block-counter').innerText = count;
        }

        function updateCameraPosition() {
            camera.position.x = cameraRadius * Math.sin(cameraAnglePhi) * Math.sin(cameraAngleTheta);
            camera.position.y = cameraRadius * Math.cos(cameraAnglePhi);
            camera.position.z = cameraRadius * Math.sin(cameraAnglePhi) * Math.cos(cameraAngleTheta);
            camera.lookAt(cameraTarget);
        }

        function onPointerDown(e) {
            isPointerDown = true;
            startTouchPos = { x: e.clientX, y: e.clientY };
            prevTouchPos = { x: e.clientX, y: e.clientY };
        }

        function onPointerMove(e) {
            if (!isPointerDown) return;

            const deltaX = e.clientX - prevTouchPos.x;
            const deltaY = e.clientY - prevTouchPos.y;

            // INTUITIVE ROTATION: Dragging right moves camera left, spinning model right
            cameraAngleTheta -= deltaX * 0.008;
            cameraAnglePhi -= deltaY * 0.008;
            cameraAnglePhi = Math.max(0.08, Math.min(Math.PI / 2 - 0.05, cameraAnglePhi));
            
            updateCameraPosition();
            prevTouchPos = { x: e.clientX, y: e.clientY };
        }

        function onPointerUp(e) {
            if (!isPointerDown) return;
            isPointerDown = false;

            const dist = Math.hypot(e.clientX - startTouchPos.x, e.clientY - startTouchPos.y);
            if (dist < 6 && appMode === 'free') {
                performRaycast(e.clientX, e.clientY);
            }
        }

        function onWheel(e) {
            cameraRadius += e.deltaY * 0.004;
            cameraRadius = Math.max(5, Math.min(15, cameraRadius));
            updateCameraPosition();
        }

        function onTouchStart(e) {
            if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }

        function onTouchMove(e) {
            if (e.touches.length === 2 && initialPinchDistance) {
                e.preventDefault();
                const newDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const delta = (initialPinchDistance - newDist) * 0.015;
                cameraRadius += delta;
                cameraRadius = Math.max(5, Math.min(15, cameraRadius));
                updateCameraPosition();
                initialPinchDistance = newDist;
            }
        }

        function onTouchEnd() {
            initialPinchDistance = null;
        }

        function performRaycast(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const targets = [];
            blocksGroup.traverse((child) => {
                if (child.isMesh && child.userData && child.userData.gridX !== undefined) targets.push(child);
            });
            baseGridGroup.traverse((child) => {
                if (child.isMesh && child.userData && child.userData.gridX !== undefined) targets.push(child);
            });

            const intersects = raycaster.intersectObjects(targets, false);
            if (intersects.length > 0) {
                const hitObj = intersects[0].object;
                if (hitObj.userData) {
                    const { gridX, gridY } = hitObj.userData;
                    if (gridX !== undefined && gridY !== undefined) {
                        handleColumnAction(gridX, gridY);
                    }
                }
            }
        }

        function handleColumnAction(x, y) {
            if (currentBuildMode === 'build') {
                let placedLevel = -1;
                for (let z = 0; z < GRID_SIZE; z++) {
                    if (!gridState[x][y][z]) {
                        gridState[x][y][z] = true;
                        placedLevel = z;
                        break;
                    }
                }
                if (placedLevel === -1) {
                    showToast('該位置高度已滿 (3層)！', 'fa-triangle-exclamation');
                    return;
                }
                playSound('build');
            } else if (currentBuildMode === 'destroy') {
                let removedLevel = -1;
                for (let z = GRID_SIZE - 1; z >= 0; z--) {
                    if (gridState[x][y][z]) {
                        gridState[x][y][z] = false;
                        removedLevel = z;
                        break;
                    }
                }
                if (removedLevel === -1) {
                    showToast('該位置沒有積木可拆除', 'fa-info-circle');
                    return;
                }
                playSound('destroy');
            }

            updateBlocks3D();
            updateAllProjections();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if (!container) return;
            const width = container.clientWidth;
            const height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        // --- 4. 2D Multiview Projections & User Drawing Logic ---
        function updateAllProjections() {
            // Render Direct Touch Matrix & Top Projection
            const touchMatrix = document.getElementById('touch-matrix');
            const gridTop = document.getElementById('grid-top');
            touchMatrix.innerHTML = '';
            gridTop.innerHTML = '';

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    let height = 0;
                    for (let z = 0; z < GRID_SIZE; z++) {
                        if (gridState[x][y][z]) height = z + 1;
                    }

                    // A. Touch Matrix Button
                    const touchBtn = document.createElement('button');
                    touchBtn.onclick = () => {
                        if (appMode === 'free') {
                            handleColumnAction(x, y);
                        }
                    };
                    touchBtn.className = `grid-cell rounded-xl border font-black text-xs flex flex-col items-center justify-center transition-all ${
                        height > 0 
                            ? 'bg-gradient-to-br from-emerald-600 to-teal-700 text-white border-emerald-400 shadow-md' 
                            : 'bg-slate-900 border-slate-800 text-slate-600 hover:border-slate-700'
                    }`;
                    touchBtn.innerHTML = `<span>${height}</span>`;
                    touchMatrix.appendChild(touchBtn);

                    // B. Top Projection Grid (Red)
                    const topCell = document.createElement('div');
                    topCell.className = `grid-cell rounded-lg border flex items-center justify-center font-extrabold text-[11px] ${
                        height > 0 
                            ? 'bg-rose-500 text-white border-rose-400 shadow-md' 
                            : 'bg-slate-900 border-slate-800 text-transparent'
                    }`;
                    topCell.innerText = height > 0 ? height : '';
                    gridTop.appendChild(topCell);
                }
            }

            // Front Projection Grid (Blue)
            const gridFront = document.getElementById('grid-front');
            gridFront.innerHTML = '';
            for (let z = GRID_SIZE - 1; z >= 0; z--) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    let exists = false;
                    for (let y = 0; y < GRID_SIZE; y++) {
                        if (gridState[x][y][z]) { exists = true; break; }
                    }

                    const frontCell = document.createElement('div');
                    frontCell.className = `grid-cell rounded-lg border ${
                        exists ? 'bg-blue-500 border-blue-400 shadow-md' : 'bg-slate-900 border-slate-800'
                    }`;
                    gridFront.appendChild(frontCell);
                }
            }

            // Right Projection Grid (Green)
            const gridRight = document.getElementById('grid-right');
            gridRight.innerHTML = '';
            for (let z = GRID_SIZE - 1; z >= 0; z--) {
                for (let y = GRID_SIZE - 1; y >= 0; y--) {
                    let exists = false;
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (gridState[x][y][z]) { exists = true; break; }
                    }

                    const rightCell = document.createElement('div');
                    rightCell.className = `grid-cell rounded-lg border ${
                        exists ? 'bg-emerald-500 border-emerald-400 shadow-md' : 'bg-slate-900 border-slate-800'
                    }`;
                    gridRight.appendChild(rightCell);
                }
            }
        }

        function renderQuizDrawingGrids() {

        // --- 5. App Modes & Quiz Checking Logic ---
        function setAppMode(mode) {
            appMode = mode;
            const btnFree = document.getElementById('btn-app-free');
            const btnQuiz = document.getElementById('btn-app-quiz');
            const btnQuizList = document.getElementById('btn-quiz-list');
            const quizBanner = document.getElementById('quiz-banner');

            if (mode === 'free') {
                btnFree.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow";
                btnQuiz.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
                btnQuizList.classList.add('hidden');
                quizBanner.classList.add('hidden');

                document.getElementById('quiz-drawing-section').classList.add('hidden');
                document.getElementById('touch-matrix-wrapper').classList.remove('hidden');
                document.getElementById('build-tools').classList.remove('hidden');
                document.getElementById('panel-title-text').innerText = '三視圖觀察與直覺觸控';
                resetBlocks();
            } else {
                btnQuiz.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-amber-500 text-slate-950 shadow font-extrabold";
                btnFree.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
                btnQuizList.classList.remove('hidden');
                quizBanner.classList.remove('hidden');
                loadQuiz(0);
            }
        }

        function toggleMultiviewPanel() {
            isMultiviewVisible = !isMultiviewVisible;
            const sec = document.getElementById('multiview-projection-section');
            const btnText = document.getElementById('multiview-toggle-text');
            const icon = document.getElementById('multiview-toggle-icon');

            if (isMultiviewVisible) {
                sec.classList.remove('hidden');
                btnText.innerText = '隱藏三視圖';
                icon.className = 'fa-solid fa-eye-slash text-[11px]';
            } else {
                sec.classList.add('hidden');
                btnText.innerText = '顯示三視圖';
                icon.className = 'fa-solid fa-eye text-[11px]';
            }
        }

        function setBuildMode(mode) {
            currentBuildMode = mode;
            const btnBuild = document.getElementById('btn-mode-build');
            const btnDestroy = document.getElementById('btn-mode-destroy');

            if (mode === 'build') {
                btnBuild.className = "px-3 py-1.5 rounded-xl font-bold text-xs transition-all flex items-center gap-1.5 bg-emerald-600 text-white shadow-md glow-active";
                btnDestroy.className = "px-3 py-1.5 rounded-xl font-bold text-xs transition-all text-slate-400 hover:text-slate-200";
            } else {
                btnBuild.className = "px-3 py-1.5 rounded-xl font-bold text-xs transition-all text-slate-400 hover:text-slate-200";
                btnDestroy.className = "px-3 py-1.5 rounded-xl font-bold text-xs transition-all bg-rose-600 text-white shadow-md glow-destroy";
            }
        }

        function resetBlocks() {
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let z = 0; z < GRID_SIZE; z++) {
                        gridState[x][y][z] = false;
                    }
                }
            }
            playSound('destroy');
            updateBlocks3D();
            updateAllProjections();
        }

        function loadQuiz(index) {
            currentQuizIndex = index;
            const q = QUIZZES[index];
            
            document.getElementById('quiz-title').innerText = q.title;
            document.getElementById('quiz-desc').innerText = q.desc;
            
            const badge = document.getElementById('quiz-badge');
            const drawingSec = document.getElementById('quiz-drawing-section');
            const touchMatrixWrap = document.getElementById('touch-matrix-wrapper');
            const buildTools = document.getElementById('build-tools');

            badge.className = "px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 font-extrabold text-[10px]";
            badge.innerText = "看模型畫三圖";
            drawingSec.classList.remove('hidden');
            touchMatrixWrap.classList.add('hidden');
            buildTools.classList.add('hidden');

            // Reset user drawing state
            userDrawnState = {
                top: Array(3).fill(null).map(() => Array(3).fill(false)),
                front: Array(3).fill(null).map(() => Array(3).fill(false)),
                right: Array(3).fill(null).map(() => Array(3).fill(false))
            };
            renderQuizDrawingGrids();

            // Load pre-built model into 3D state
            gridState = JSON.parse(JSON.stringify(q.modelGridState));
            updateBlocks3D();
            updateAllProjections();

            closeQuizModal();
            showToast(`已載入關卡：${q.title}`, 'fa-graduation-cap');
        }

        function checkQuizAnswer() {
            const q = QUIZZES[currentQuizIndex];
            
            // Calculate actual projections from current 3D gridState
            const currentProj = {
                top: Array(3).fill(null).map(() => Array(3).fill(0)),
                front: Array(3).fill(null).map(() => Array(3).fill(0)),
                right: Array(3).fill(null).map(() => Array(3).fill(0))
            };

            for (let x=0; x<3; x++) {
                for (let y=0; y<3; y++) {
                    let h = 0;
                    for (let z=0; z<3; z++) if (gridState[x][y][z]) h = 1;
                    currentProj.top[y][x] = h;
                }
            }

            for (let z=2; z>=0; z--) {
                for (let x=0; x<3; x++) {
                    let exists = 0;
                    for (let y=0; y<3; y++) if (gridState[x][y][z]) exists = 1;
                    currentProj.front[2-z][x] = exists;
                }
            }

            for (let z=2; z>=0; z--) {
                for (let y=2; y>=0; y--) {
                    let exists = 0;
                    for (let x=0; x<3; x++) if (gridState[x][y][z]) exists = 1;
                    currentProj.right[2-z][2-y] = exists;
                }
            }

            let isCorrect = true;

            // Compare user's drawn 2D grids with calculated model projections
            for (let r=0; r<3; r++) {
                for (let c=0; c<3; c++) {
                    if (Boolean(userDrawnState.top[r][c]) !== Boolean(currentProj.top[r][c]) ||
                        Boolean(userDrawnState.front[r][c]) !== Boolean(currentProj.front[r][c]) ||
                        Boolean(userDrawnState.right[r][c]) !== Boolean(currentProj.right[r][c])) {
                        isCorrect = false;
                    }
                }
            }

            if (isCorrect) {
                playSound('win');
                showToast('🎉 太棒了！答案完全正確！', 'fa-circle-check');
            } else {
                playSound('error');
                showToast('❌ 答案有些不符，再仔細觀察看看喔！', 'fa-circle-xmark');
            }
        }

        function snapCamera(preset) {
            switch (preset) {
                case '3d':
                    cameraAngleTheta = Math.PI / 4;
                    cameraAnglePhi = Math.PI / 3.2;
                    cameraRadius = 8.2;
                    break;
                case 'top':
                    cameraAngleTheta = 0;
                    cameraAnglePhi = 0.08;
                    cameraRadius = 8.8;
                    break;
                case 'front':
                    cameraAngleTheta = 0;
                    cameraAnglePhi = Math.PI / 2 - 0.08;
                    cameraRadius = 8.2;
                    break;
                case 'right':
                    cameraAngleTheta = Math.PI / 2;
                    cameraAnglePhi = Math.PI / 2 - 0.08;
                    cameraRadius = 8.2;
                    break;
            }
            updateCameraPosition();
        }

        function showToast(msg, iconClass = 'fa-info-circle') {
            const toast = document.getElementById('toast-msg');
            const text = document.getElementById('toast-text');
            const icon = document.getElementById('toast-icon');

            text.innerText = msg;
            icon.className = `fa-solid ${iconClass}`;

            toast.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
            }, 2500);
        }

        function openQuizModal() {
            const modal = document.getElementById('quiz-modal');
            const listContainer = document.getElementById('quiz-list-container');
            listContainer.innerHTML = '';

            QUIZZES.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.onclick = () => loadQuiz(idx);
                btn.className = `p-3 rounded-2xl border text-left flex flex-col gap-1 transition-all ${
                    idx === currentQuizIndex && appMode === 'quiz'
                        ? 'bg-indigo-950/80 border-indigo-500/80 shadow-md'
                        : 'bg-slate-950 hover:bg-slate-800 border-slate-800'
                }`;

                const badgeText = '看模型畫三圖';
                const badgeColor = 'bg-amber-500/20 text-amber-300 border-amber-500/40';

                btn.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-xs text-slate-100">${q.title}</span>
                        <span class="px-2 py-0.5 rounded-full border ${badgeColor} font-extrabold text-[9px]">${badgeText}</span>
                    </div>
                    <p class="text-[10px] text-slate-400 line-clamp-1">${q.desc}</p>
                `;
                listContainer.appendChild(btn);
            });

            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeQuizModal() {
            const modal = document.getElementById('quiz-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        window.onload = function() {
            init3D();
        };
    </script>
</body>
</html>
